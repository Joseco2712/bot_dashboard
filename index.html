<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Configuración - Bot de Discord</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <div class="izq">
                <a href="https://www.youtube.com/" style="display: flex; align-items:  center;">
                    <img src="/IMG_4571.webp" alt="Logo del bot" width="31" height="31" style="border-radius: 50%; margin-right: 0.7rem;">
                    <span style="font-size: 125%; font-weight: bold;">Joseco</span>
                </a>
                <a href="#Comandos">Configuraciones Generales</a>
                <a href="#Dashboard">Dashboard</a>
            </div>
            <div class="der">
                <a href="#integraciones">Integraciones</a>
                <a href="#ajustes">Ajustes del Bot</a>
            </div>
        </nav>

    </header>      

    <main>
        <section>
        <h2>Configuraciones Generales</h2>
        <label for="prefix">Prefijo de comandos:</label>
        <input type="text" id="prefix" placeholder="Ej: !" />
        <button onclick="guardarConfiguracion()">Guardar</button>
        </section>

        <section id="ajustes">
            <h2>Ajustes del Bot</h2>
            <label for="bienvenida">Mensaje de Bienvenida:</label>
            <input type="text" id="bienvenida" placeholder="Escribe un mensaje de bienvenida" />
          
            <label for="canal">Canal de Bienvenida:</label>
            <input type="text" id="canal" placeholder="Escribe el ID del canal" />
          
            <button onclick="guardarAjustes()">Guardar Ajustes</button>
        </section>

        <section id="configuracion">
            <h2>Configuraciones del Bot</h2>
            <form>
                <label for="prefix">Prefijo de comandos:</label>
                <input type="text" id="prefix" placeholder="Ej: !" />
          
                <label for="prefix">Elige un color para el embed:</label>
                <input type="color" id="color" />
          
                <label for="mensaje_bienvenida">Mensaje de bienvenida:</label>
                <textarea id="mensaje_bienvenida" rows="4" placeholder="¡Bienvenido al servidor!"></textarea>
          
                <button type="submit">Guardar Configuración</button>
            </form>
        </section>
          
    </main>

    <footer>
        <p>Dashboard para tu bot</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
